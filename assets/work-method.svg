<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">A repeatable way of working</title>
  <desc id="desc">An abstract engineering loop connecting frame, build, stress, and explain.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07171c"/>
      <stop offset="0.52" stop-color="#0a2227"/>
      <stop offset="1" stop-color="#10362f"/>
    </linearGradient>
    <linearGradient id="trace" x1="430" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#74e7c1" stop-opacity="0.3"/>
      <stop offset="0.48" stop-color="#87d8ff"/>
      <stop offset="1" stop-color="#e8c778" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8ff4d3" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8ff4d3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a6ddd0" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="330" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="330" fill="url(#surface)"/>
    <rect width="1200" height="330" fill="url(#grid)"/>
    <circle cx="1110" cy="36" r="180" fill="#2ca889" fill-opacity="0.08"/>
    <circle cx="736" cy="355" r="230" fill="#3d85a8" fill-opacity="0.06"/>

    <g fill="none" stroke="#90d8ca" stroke-opacity="0.11">
      <path d="M-40 286C210 228 292 296 474 266S818 190 1240 250"/>
      <path d="M-20 306C218 250 324 312 506 283S858 216 1230 270"/>
    </g>

    <g font-family="'IBM Plex Mono','Cascadia Mono',monospace" letter-spacing="3">
      <text x="54" y="54" fill="#76d8bc" font-size="11">METHOD / 02</text>
      <text x="54" y="281" fill="#79b2aa" font-size="9">RESEARCH  /  ENGINEERING  /  OPEN SOURCE</text>
    </g>
    <text x="54" y="104" fill="#f4f8f7" font-family="'Segoe UI',sans-serif" font-size="32" font-weight="650">A repeatable way</text>
    <text x="54" y="143" fill="#f4f8f7" font-family="'Segoe UI',sans-serif" font-size="32" font-weight="650">of working.</text>
    <text x="54" y="188" fill="#a8c5c1" font-family="'Segoe UI',sans-serif" font-size="15">Move from an interesting question</text>
    <text x="54" y="212" fill="#a8c5c1" font-family="'Segoe UI',sans-serif" font-size="15">to evidence another person can inspect.</text>

    <path d="M418 177C485 119 554 119 620 171S755 224 822 166 958 105 1134 165" fill="none" stroke="#5fcbae" stroke-opacity="0.18" stroke-width="8" filter="url(#blur)"/>
    <path id="work-path" d="M418 177C485 119 554 119 620 171S755 224 822 166 958 105 1134 165" fill="none" stroke="url(#trace)" stroke-width="2"/>
    <path d="M418 177C485 119 554 119 620 171S755 224 822 166 958 105 1134 165" fill="none" stroke="#b8efe0" stroke-opacity="0.34" stroke-width="1" stroke-dasharray="3 13"/>

    <g font-family="'IBM Plex Mono','Cascadia Mono',monospace">
      <g transform="translate(432 126)">
        <circle r="8" fill="#8ff1d0"/>
        <circle r="22" fill="none" stroke="#8ff1d0" stroke-opacity="0.26"/>
        <text x="-18" y="58" fill="#79d9bd" font-size="10" letter-spacing="2">01 / FRAME</text>
        <text x="-18" y="82" fill="#e7f0ee" font-size="13">question  -&gt;  constraint</text>
      </g>
      <g transform="translate(635 182)">
        <circle r="8" fill="#86d7f5"/>
        <circle r="22" fill="none" stroke="#86d7f5" stroke-opacity="0.26"/>
        <text x="-23" y="57" fill="#86d7f5" font-size="10" letter-spacing="2">02 / BUILD</text>
        <text x="-23" y="81" fill="#e7f0ee" font-size="13">model  -&gt;  system</text>
      </g>
      <g transform="translate(830 158)">
        <circle r="8" fill="#97e4d6"/>
        <circle r="22" fill="none" stroke="#97e4d6" stroke-opacity="0.26"/>
        <text x="-22" y="-64" fill="#82d5c4" font-size="10" letter-spacing="2">03 / STRESS</text>
        <text x="-22" y="-40" fill="#e7f0ee" font-size="13">edge  -&gt;  failure</text>
      </g>
      <g transform="translate(1102 153)">
        <circle r="8" fill="#e4c979"/>
        <circle r="22" fill="none" stroke="#e4c979" stroke-opacity="0.26"/>
        <text x="-96" y="62" fill="#d9c779" font-size="10" letter-spacing="2">04 / EXPLAIN</text>
        <text x="-96" y="86" fill="#e7f0ee" font-size="13">evidence  -&gt;  decision</text>
      </g>
    </g>

    <circle r="16" fill="url(#glow)" opacity="0.85">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#work-path"/>
      </animateMotion>
    </circle>
    <circle r="3.5" fill="#effffc">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#work-path"/>
      </animateMotion>
    </circle>
  </g>

  <style>
    @media (prefers-reduced-motion: reduce) {
      animateMotion { display: none; }
    }
  </style>
</svg>
