<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" role="img" aria-labelledby="title desc">
  <title id="title">A repeatable way of working</title>
  <desc id="desc">An abstract engineering loop connecting frame, build, stress, and explain.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07171c"/>
      <stop offset="0.55" stop-color="#0a2227"/>
      <stop offset="1" stop-color="#10362f"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="180" x2="0" y2="594" gradientUnits="userSpaceOnUse">
      <stop stop-color="#74e7c1"/>
      <stop offset="0.56" stop-color="#87d8ff"/>
      <stop offset="1" stop-color="#e8c778"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8ff4d3" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#8ff4d3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a6ddd0" stroke-opacity="0.055"/>
    </pattern>
    <filter id="blur" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="frame">
      <rect width="680" height="650" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="680" height="650" fill="url(#surface)"/>
    <rect width="680" height="650" fill="url(#grid)"/>
    <circle cx="642" cy="40" r="190" fill="#2ca889" fill-opacity="0.08"/>
    <circle cx="30" cy="636" r="240" fill="#3d85a8" fill-opacity="0.06"/>

    <g font-family="'IBM Plex Mono','Cascadia Mono',monospace" letter-spacing="3">
      <text x="48" y="52" fill="#76d8bc" font-size="11">METHOD / 02</text>
      <text x="48" y="617" fill="#79b2aa" font-size="9">RESEARCH  /  ENGINEERING  /  OPEN SOURCE</text>
    </g>
    <text x="48" y="104" fill="#f4f8f7" font-family="'Segoe UI',sans-serif" font-size="32" font-weight="650">A repeatable way of working.</text>
    <text x="48" y="140" fill="#a8c5c1" font-family="'Segoe UI',sans-serif" font-size="15">From an interesting question to inspectable evidence.</text>

    <path d="M90 201C203 239 171 318 314 340S442 417 563 457 515 551 586 579" fill="none" stroke="#5fcbae" stroke-opacity="0.2" stroke-width="10" filter="url(#blur)"/>
    <path id="work-path" d="M90 201C203 239 171 318 314 340S442 417 563 457 515 551 586 579" fill="none" stroke="url(#trace)" stroke-width="2.5"/>
    <path d="M90 201C203 239 171 318 314 340S442 417 563 457 515 551 586 579" fill="none" stroke="#b8efe0" stroke-opacity="0.34" stroke-width="1" stroke-dasharray="4 14"/>

    <g font-family="'IBM Plex Mono','Cascadia Mono',monospace">
      <g transform="translate(91 201)">
        <circle r="9" fill="#8ff1d0"/>
        <circle r="24" fill="none" stroke="#8ff1d0" stroke-opacity="0.26"/>
        <text x="38" y="-12" fill="#79d9bd" font-size="11" letter-spacing="2">01 / FRAME</text>
        <text x="38" y="15" fill="#e7f0ee" font-size="14">question  -&gt;  constraint</text>
      </g>
      <g transform="translate(279 334)">
        <circle r="9" fill="#86d7f5"/>
        <circle r="24" fill="none" stroke="#86d7f5" stroke-opacity="0.26"/>
        <text x="38" y="-12" fill="#86d7f5" font-size="11" letter-spacing="2">02 / BUILD</text>
        <text x="38" y="15" fill="#e7f0ee" font-size="14">model  -&gt;  system</text>
      </g>
      <g transform="translate(533 446)">
        <circle r="9" fill="#97e4d6"/>
        <circle r="24" fill="none" stroke="#97e4d6" stroke-opacity="0.26"/>
        <text x="-184" y="-24" fill="#82d5c4" font-size="11" letter-spacing="2">03 / STRESS</text>
        <text x="-184" y="3" fill="#e7f0ee" font-size="14">edge  -&gt;  failure</text>
      </g>
      <g transform="translate(585 579)">
        <circle r="9" fill="#e4c979"/>
        <circle r="24" fill="none" stroke="#e4c979" stroke-opacity="0.26"/>
        <text x="-230" y="-22" fill="#d9c779" font-size="11" letter-spacing="2">04 / EXPLAIN</text>
        <text x="-230" y="5" fill="#e7f0ee" font-size="14">evidence  -&gt;  decision</text>
      </g>
    </g>

    <circle r="18" fill="url(#glow)" opacity="0.85">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#work-path"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="#effffc">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#work-path"/>
      </animateMotion>
    </circle>
  </g>

  <style>
    @media (prefers-reduced-motion: reduce) {
      animateMotion { display: none; }
    }
  </style>
</svg>
