<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Nianze Wu</title>
  <desc id="description">AI for Science, generative systems, reliable software, and open-source engineering</desc>
  <defs>
    <style>
      .trace { animation: trace 14s linear infinite; }
      .trace-slow { animation: trace 22s linear infinite reverse; }
      .pulse {
        animation: pulse 4.8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .drift {
        animation: drift 8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .scan { animation: scan 7s ease-in-out infinite; }
      @keyframes trace { to { stroke-dashoffset: -220; } }
      @keyframes pulse {
        0%, 100% { opacity: 0.38; transform: scale(0.82); }
        50% { opacity: 1; transform: scale(1.18); }
      }
      @keyframes drift {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(7px, -5px); }
      }
      @keyframes scan {
        0%, 100% { opacity: 0.08; transform: translateX(-22px); }
        50% { opacity: 0.32; transform: translateX(24px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .trace, .trace-slow, .pulse, .drift, .scan { animation: none; }
      }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#051019" />
      <stop offset="0.54" stop-color="#09212a" />
      <stop offset="1" stop-color="#10372f" />
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76f0cb" stop-opacity="0.92" />
      <stop offset="1" stop-color="#7db9ff" stop-opacity="0.24" />
    </linearGradient>
    <radialGradient id="mintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#55e6bc" stop-opacity="0.34" />
      <stop offset="1" stop-color="#55e6bc" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#63a8ff" stop-opacity="0.2" />
      <stop offset="1" stop-color="#63a8ff" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#a6d8d1" stroke-opacity="0.075" />
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="30" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)" />
    <rect width="1200" height="360" fill="url(#grid)" />
    <circle cx="1050" cy="38" r="275" fill="url(#mintGlow)" />
    <circle cx="755" cy="355" r="245" fill="url(#blueGlow)" />
    <ellipse cx="1040" cy="190" rx="132" ry="104" fill="#55e6bc" opacity="0.07" filter="url(#blur)" />

    <path d="M0 314 C260 270 428 352 675 300 S1006 253 1200 281" fill="none" stroke="#7db9ff" stroke-opacity="0.1" />
    <path d="M0 322 C248 282 442 359 675 311 S1014 265 1200 291" fill="none" stroke="#76f0cb" stroke-opacity="0.13" />

    <g transform="translate(735 34)">
      <text x="14" y="19" fill="#9ccbc2" font-family="Consolas, monospace" font-size="11" letter-spacing="2.4">STATE SPACE / 01</text>
      <line x1="14" y1="35" x2="415" y2="35" stroke="#93c9c0" stroke-opacity="0.15" />
      <line class="scan" x1="212" y1="45" x2="212" y2="282" stroke="#7db9ff" stroke-opacity="0.48" />

      <g class="drift" fill="none">
        <ellipse cx="258" cy="150" rx="164" ry="88" transform="rotate(-14 258 150)" stroke="#76f0cb" stroke-opacity="0.42" />
        <ellipse cx="258" cy="150" rx="127" ry="62" transform="rotate(17 258 150)" stroke="#7db9ff" stroke-opacity="0.3" />
        <path d="M39 241 C103 176 150 207 199 135 S313 54 410 102" stroke="url(#hairline)" stroke-width="2.2" />
        <path class="trace" d="M29 267 C102 223 166 229 220 172 S337 98 425 129" stroke="#76f0cb" stroke-opacity="0.46" stroke-dasharray="7 10" />
        <path class="trace-slow" d="M79 70 C147 113 170 87 235 111 S348 187 404 226" stroke="#7db9ff" stroke-opacity="0.3" stroke-dasharray="3 11" />
      </g>

      <g fill="#b5fae6">
        <circle cx="75" cy="212" r="4" />
        <circle cx="199" cy="135" r="5" />
        <circle class="pulse" cx="270" cy="145" r="7" />
        <circle cx="350" cy="79" r="4" />
        <circle cx="400" cy="185" r="4" />
      </g>
      <circle cx="270" cy="145" r="18" fill="#55e6bc" opacity="0.34" filter="url(#nodeGlow)" />

      <circle r="4.5" fill="#e8fff8">
        <animateMotion dur="8s" repeatCount="indefinite" path="M39 241 C103 176 150 207 199 135 S313 54 410 102" />
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite" />
      </circle>

      <g fill="#91beb6" font-family="Consolas, monospace" font-size="10">
        <text x="38" y="283">x / observation</text>
        <text x="332" y="270">t / iteration</text>
        <text x="279" y="136" fill="#d8fff3">f(theta)</text>
      </g>
    </g>
  </g>

  <g font-family="Bahnschrift, Trebuchet MS, sans-serif">
    <line x1="76" y1="61" x2="76" y2="267" stroke="#76f0cb" stroke-width="2" />
    <text x="98" y="67" fill="#8fbdb5" font-family="Consolas, monospace" font-size="12" letter-spacing="2.8">RESEARCH / ENGINEERING / OPEN SOURCE</text>
    <text x="94" y="145" fill="#f5fbf9" font-size="62" font-weight="600" letter-spacing="0.6">Nianze Wu</text>
    <text x="98" y="188" fill="#c2ddd7" font-size="21">AI for Science, generative systems, and software that can be tested.</text>

    <g font-family="Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.2">
      <text x="98" y="239" fill="#8ff2d3">AI4S</text>
      <rect x="151" y="228" width="3" height="3" fill="#4e8179" />
      <text x="171" y="239" fill="#bad9d2">GENERATIVE SYSTEMS</text>
      <rect x="330" y="228" width="3" height="3" fill="#4e8179" />
      <text x="350" y="239" fill="#bad9d2">RELIABLE ML</text>
      <rect x="458" y="228" width="3" height="3" fill="#4e8179" />
      <text x="478" y="239" fill="#bad9d2">PRODUCT ENGINEERING</text>
    </g>

    <line x1="98" y1="273" x2="614" y2="273" stroke="#8fbdb5" stroke-opacity="0.22" />
    <text x="98" y="300" fill="#789f98" font-family="Consolas, monospace" font-size="11" letter-spacing="1.6">INFORMATION + COMPUTING SCIENCE / XIAMEN UNIVERSITY</text>
  </g>
</svg>
