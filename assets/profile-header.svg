<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Nianze Wu</title>
  <desc id="description">AI for Science, generative systems, and open-source engineering</desc>
  <defs>
    <style>
      .flow-line {
        animation: flow 10s linear infinite;
      }
      .pulse-node {
        animation: pulse 3.6s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .float-mark {
        animation: bob 5.2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .spark {
        animation: sparkle 2.8s ease-in-out infinite;
      }
      @keyframes flow {
        to { stroke-dashoffset: -160; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.45; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.25); }
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes sparkle {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow-line, .pulse-node, .float-mark, .spark { animation: none; }
      }
    </style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.55" stop-color="#0b2430" />
      <stop offset="1" stop-color="#12372e" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#54e3b5" stop-opacity="0.42" />
      <stop offset="1" stop-color="#54e3b5" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8fdcc5" stroke-opacity="0.09" />
    </pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)" />
  <rect width="1200" height="320" rx="28" fill="url(#grid)" />
  <circle cx="1030" cy="62" r="255" fill="url(#glow)" />

  <g fill="none" stroke="#79e8c7" stroke-opacity="0.34">
    <path d="M778 250 C845 179 894 185 933 126 S1032 53 1159 91" stroke-width="2" />
    <path class="flow-line" d="M792 276 C866 225 913 235 963 188 S1080 126 1172 151" stroke-width="1" stroke-dasharray="7 9" />
    <ellipse cx="1014" cy="157" rx="153" ry="101" transform="rotate(-12 1014 157)" stroke="#ffc978" stroke-opacity="0.22" />
  </g>

  <g transform="translate(1018 158)">
    <g class="float-mark">
      <circle r="101" fill="#f8f3e7" fill-opacity="0.96" stroke="#ffc978" stroke-opacity="0.72" stroke-width="3" />
      <circle cx="-53" cy="-53" r="27" fill="#f8f3e7" stroke="#0b2430" stroke-width="11" />
      <circle cx="53" cy="-53" r="27" fill="#f8f3e7" stroke="#0b2430" stroke-width="11" />
      <ellipse cy="7" rx="76" ry="72" fill="#fdfbf5" stroke="#0b2430" stroke-width="11" />
      <circle cx="-27" cy="-7" r="6" fill="#0b2430" />
      <circle cx="27" cy="-7" r="6" fill="#0b2430" />
      <path d="M0 10 L-8 23 Q0 31 8 23 Z" fill="#0b2430" />
      <path d="M0 29 C-3 46 -20 47 -25 35 M0 29 C3 46 20 47 25 35" fill="none" stroke="#0b2430" stroke-width="7" stroke-linecap="round" />
    </g>
  </g>
  <g fill="#ffc978">
    <circle class="spark" cx="857" cy="84" r="5" />
    <circle class="spark" cx="1160" cy="214" r="4" style="animation-delay: 1.1s" />
  </g>
  <g fill="#9cf2d7">
    <circle cx="823" cy="213" r="5" />
    <circle class="pulse-node" cx="918" cy="135" r="6" />
    <circle cx="1139" cy="73" r="5" />
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="79" y="68" fill="#ffc978" font-size="14" font-weight="700" letter-spacing="3.4">HELLO, I'M</text>
    <text x="76" y="129" fill="#f4fbf8" font-size="58" font-weight="700" letter-spacing="1">Nianze Wu</text>
    <text x="79" y="169" fill="#b9d8cf" font-size="22" font-weight="400">Information and Computing Science at Xiamen University</text>

    <g font-size="15" font-weight="600" letter-spacing="1.6">
      <rect x="78" y="211" width="150" height="38" rx="19" fill="#54e3b5" fill-opacity="0.14" stroke="#54e3b5" stroke-opacity="0.55" />
      <text x="101" y="236" fill="#9cf2d7">AI FOR SCIENCE</text>

      <rect x="242" y="211" width="218" height="38" rx="19" fill="#54e3b5" fill-opacity="0.1" stroke="#54e3b5" stroke-opacity="0.42" />
      <text x="265" y="236" fill="#c3e8dd">GENERATIVE SYSTEMS</text>

      <rect x="474" y="211" width="163" height="38" rx="19" fill="#54e3b5" fill-opacity="0.08" stroke="#54e3b5" stroke-opacity="0.35" />
      <text x="497" y="236" fill="#c3e8dd">OPEN SOURCE</text>
    </g>
  </g>
</svg>
