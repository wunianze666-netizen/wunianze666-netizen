<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-labelledby="title description">
  <title id="title">Nianze Wu</title>
  <desc id="description">AI for Science, generative systems, and open-source engineering</desc>
  <defs>
    <style>
      .flow-line { animation: flow 10s linear infinite; }
      .pulse-node {
        animation: pulse 3.6s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .float-mark {
        animation: bob 5.2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes flow { to { stroke-dashoffset: -160; } }
      @keyframes pulse {
        0%, 100% { opacity: 0.45; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow-line, .pulse-node, .float-mark { animation: none; }
      }
    </style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.58" stop-color="#0b2430" />
      <stop offset="1" stop-color="#12372e" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#54e3b5" stop-opacity="0.38" />
      <stop offset="1" stop-color="#54e3b5" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#8fdcc5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <rect width="680" height="360" rx="28" fill="url(#background)" />
  <rect width="680" height="360" rx="28" fill="url(#grid)" />
  <circle cx="602" cy="18" r="190" fill="url(#glow)" />

  <g fill="none" stroke="#79e8c7" stroke-opacity="0.32">
    <path d="M410 101 C476 48 548 52 662 111" stroke-width="2" />
    <path class="flow-line" d="M396 130 C484 81 555 97 670 157" stroke-width="1" stroke-dasharray="7 9" />
    <ellipse cx="568" cy="91" rx="88" ry="59" transform="rotate(10 568 91)" stroke="#ffc978" stroke-opacity="0.22" />
  </g>
  <g transform="translate(574 88)">
    <g class="float-mark">
      <circle r="60" fill="#f8f3e7" fill-opacity="0.96" stroke="#ffc978" stroke-opacity="0.72" stroke-width="2" />
      <circle cx="-31" cy="-31" r="16" fill="#f8f3e7" stroke="#0b2430" stroke-width="7" />
      <circle cx="31" cy="-31" r="16" fill="#f8f3e7" stroke="#0b2430" stroke-width="7" />
      <ellipse cy="5" rx="45" ry="43" fill="#fdfbf5" stroke="#0b2430" stroke-width="7" />
      <circle cx="-16" cy="-4" r="4" fill="#0b2430" />
      <circle cx="16" cy="-4" r="4" fill="#0b2430" />
      <path d="M0 6 L-5 14 Q0 19 5 14 Z" fill="#0b2430" />
      <path d="M0 18 C-2 29 -12 29 -15 22 M0 18 C2 29 12 29 15 22" fill="none" stroke="#0b2430" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>
  <g fill="#9cf2d7">
    <circle cx="448" cy="72" r="4" />
    <circle class="pulse-node" cx="493" cy="112" r="5" />
    <circle cx="654" cy="122" r="4" />
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="47" y="63" fill="#ffc978" font-size="13" font-weight="700" letter-spacing="3">HELLO, I'M</text>
    <text x="44" y="124" fill="#f4fbf8" font-size="58" font-weight="700" letter-spacing="1">Nianze Wu</text>
    <text x="47" y="171" fill="#b9d8cf" font-size="23">AI for Science and reliable generative systems</text>

    <g font-size="15" font-weight="600" letter-spacing="1.3">
      <rect x="46" y="220" width="149" height="40" rx="20" fill="#54e3b5" fill-opacity="0.14" stroke="#54e3b5" stroke-opacity="0.55" />
      <text x="69" y="246" fill="#9cf2d7">AI FOR SCIENCE</text>

      <rect x="207" y="220" width="218" height="40" rx="20" fill="#54e3b5" fill-opacity="0.1" stroke="#54e3b5" stroke-opacity="0.42" />
      <text x="230" y="246" fill="#c3e8dd">GENERATIVE SYSTEMS</text>

      <rect x="437" y="220" width="163" height="40" rx="20" fill="#54e3b5" fill-opacity="0.08" stroke="#54e3b5" stroke-opacity="0.35" />
      <text x="460" y="246" fill="#c3e8dd">OPEN SOURCE</text>
    </g>
  </g>
</svg>
